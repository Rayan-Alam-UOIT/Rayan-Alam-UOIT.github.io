<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Message Sent | Rayan Alam</title>

  <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/source-code.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="thank-page">

  <div class="noise-overlay"></div>

  <nav class="navbar scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo">Rayan<span>.</span>Alam</a>
    </div>
  </nav>

  <main class="thank-you-section">
    <div class="thank-you-card">

      <div class="success-icon">
        <i class="fa-solid fa-check"></i>
      </div>

      <p class="eyebrow center">Message Received</p>

      <h1>Thank you.</h1>

      <p class="thank-copy">
        Your message has been successfully sent.
        I’ll review it and get back to you as soon as possible.
      </p>

      <p class="redirect-text" aria-live="polite">
        Redirecting home in <span id="countdown">5</span> seconds...
      </p>

      <div class="thank-actions">
        <a href="index.html" class="btn btn-primary">
          Return Home <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

    </div>
  </main>

  <script>
    let seconds = 5;
    const countdown = document.getElementById("countdown");

    const timer = setInterval(() => {
      seconds--;
      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "index.html";
      }
    }, 1000);
  </script>

</body>
</html>
